name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: '手动运行目标'
        required: false
        type: choice
        options:
          - ci
          - storage
          - all
        default: ci

permissions: {}

env:
  PYTHONIOENCODING: utf-8

jobs:
  validate:
    name: Python and workflow checks
    if: >-
      github.event_name != 'schedule' &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.target == '' ||
        inputs.target == 'ci' ||
        inputs.target == 'all'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt PyYAML

      - name: Compile Python files
        run: python -m py_compile scripts/crawl_zol.py scripts/crawl_pconline.py scripts/restore_pconline_cache.py scripts/merge_phones.py scripts/search_root_info.py scripts/proxy_manager.py scripts/generate_clash_config.py scripts/ai_verify_root_status.py

      - name: Validate syntax
        run: python scripts/validate_syntax.py

      - name: Validate workflow expectations
        run: python scripts/validate_workflow_expectations.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  storage-policy:
    name: Storage policy
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (
        github.event_name == 'workflow_dispatch' &&
        (inputs.target == 'storage' || inputs.target == 'all')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/validate_storage_policy.py
