name: 部署手机配置网页

on:
  push:
    branches:
      - main
      - master
    paths:
      - docs/phones/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:
    inputs:
      mode:
        description: '部署与单源审计模式'
        required: false
        type: choice
        options:
          - deploy_and_audit
          - deploy_only
          - audit_only
        default: deploy_and_audit

permissions: {}

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'audit_only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@main

      - name: 设置 Python
        uses: actions/setup-python@main
        with:
          python-version: "3.12"

      - name: 准备静态站点
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf site release-files
          mkdir -p site/data
          cp -R docs/phones/. site/

          FOUND_DATA=false
          for TAG in $(gh release list --repo "${{ github.repository }}" --limit 30 --json tagName --jq '.[].tagName'); do
            rm -rf release-files
            mkdir -p release-files
            gh release download "$TAG" \
              --repo "${{ github.repository }}" \
              --dir release-files \
              --pattern 'merged_phones_*.json' \
              --pattern 'merged_phones_*.csv' \
              --pattern 'phones_with_root_info.json' >/dev/null 2>&1 || true

            MERGED_JSON=$(ls release-files/merged_phones_*.json 2>/dev/null | head -n 1 || true)
            if [ -z "$MERGED_JSON" ]; then
              continue
            fi

            ROWS=$(python - "$MERGED_JSON" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              print(len(json.load(f)))
          PY
          )

            if [ "$ROWS" -lt 10 ]; then
              echo "跳过：$TAG 的 merged 数据只有 $ROWS 行，低于 Pages 发布门槛"
              continue
            fi

            DATE=$(basename "$MERGED_JSON" | sed -E 's/merged_phones_([0-9]+)\.json/\1/')
            if [ -f "release-files/phones_with_root_info.json" ]; then
              cp "release-files/phones_with_root_info.json" site/data/latest.json
            else
              cp "$MERGED_JSON" site/data/latest.json
            fi
            cp release-files/merged_phones_*.csv "site/data/merged_phones_${DATE}.csv"

            if curl -fsSL "https://phones.jiucai.eu.org/data/latest.json" -o /tmp/phones-pages-baseline.json; then
              python scripts/verify_publish_superset.py /tmp/phones-pages-baseline.json site/data/latest.json
            elif [ -f "docs/phones/data/latest.json" ]; then
              echo "未能读取线上 Pages 基线，改用仓库内 Pages 基线校验"
              python scripts/verify_publish_superset.py docs/phones/data/latest.json site/data/latest.json
            else
              echo "未能读取线上 Pages 基线且仓库内无基线，拒绝发布以避免缩小稳定数据"
              exit 1
            fi

            python - "$DATE" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone

          date = sys.argv[1]
          with open("site/data/latest.json", encoding="utf-8") as f:
              latest = json.load(f)

          manifest = {
              "date": date,
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "rowCount": len(latest),
              "files": {
                  "latestJson": "data/latest.json",
                  "latestCsv": f"data/merged_phones_{date}.csv",
              },
          }
          with open("site/data/manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          PY

            FOUND_DATA=true
            echo "使用 $TAG 发布网页数据：$ROWS 行"
            break
          done

          if [ "$FOUND_DATA" != "true" ]; then
            echo "未找到可用 Release 数据，仅发布网页外壳"
          fi

          touch site/.nojekyll

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上传 Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  audit:
    name: Single-source audit
    needs: deploy
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'deploy_only') &&
      (
        needs.deploy.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'audit_only')
      )
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch latest.json from Pages
        run: |
          REPO=$(echo ${{ github.repository }} | sed 's|.*/||')
          case "$REPO" in
            crawl_cars) PAGES_URL="https://cars.jiucai.eu.org/data/latest.json" ;;
            crawl_phones) PAGES_URL="https://phones.jiucai.eu.org/data/latest.json" ;;
            crawl_laptops) PAGES_URL="https://nbs.jiucai.eu.org/data/latest.json" ;;
            *) echo "Unknown repo"; exit 0 ;;
          esac
          echo "PAGES_URL=$PAGES_URL"
          mkdir -p ./data
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 180 "$PAGES_URL" -o ./data/latest.json || echo "FETCH_FAILED"

      - name: Analyze single-source data
        run: |
          python3 scripts/analyze_single_source.py --data ./data/latest.json --output ./audit_report.json
          cat ./audit_report.json | head -50

      - name: Call AA 50+ LLM for root cause analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          KIMI_CODINGPLAN_API_KEY: ${{ secrets.KIMI_CODINGPLAN_API_KEY }}
          ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: |
          python3 scripts/llm_single_source_audit.py --data ./data/latest.json --report ./audit_report.json --output ./llm_analysis.md
          echo "=== LLM Analysis ==="
          head -80 ./llm_analysis.md || true

      - name: Create or update issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('./audit_report.json', 'utf8');
            const analysis = fs.existsSync('./llm_analysis.md') ? fs.readFileSync('./llm_analysis.md', 'utf8') : 'No LLM analysis available';
            const reportData = JSON.parse(report);
            const title = `Single-source audit: ${reportData.single_rate}% single (${reportData.single_count}/${reportData.total})`;
            const body = `## Single Source Audit Report

            **Generated:** ${new Date().toISOString()}
            **Total rows:** ${reportData.total}
            **Multi-source:** ${reportData.multi_count} (${reportData.multi_rate}%)
            **Single-source:** ${reportData.single_count} (${reportData.single_rate}%)

            ### Root Causes

            ${JSON.stringify(reportData.causes, null, 2)}

            ### LLM Analysis (AA 50+ model)

            ${analysis}

            ### Source Distribution

            ${JSON.stringify(reportData.source_distribution, null, 2)}
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'single-source-audit'
            });

            const existing = issues.data.find(i => i.title.startsWith('Single-source audit:'));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body
              });
              console.log(`Updated issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['single-source-audit', 'automated']
              });
              console.log('Created new issue');
            }
