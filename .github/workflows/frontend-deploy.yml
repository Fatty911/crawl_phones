# ── GitHub Actions 硬开关（2026-10-05 用户裁定）────────────────────────
# GitHub 账户曾因反滥用机制误伤暂停，爬虫/AI 自修复禁止在 Actions 运行。
# 工作流主力 = 腾讯云 CNB（.cnb.yml）。此处 if:false 防止 UI 误开后仍执行。
# 七端代码对等同步，仅工作流免费资源不同。
name: 前端展示独立部署
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/phones/**'
      - '!docs/phones/data/**'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-frontend:
    if: false  # CNB 为工作流主力，GitHub Actions 禁跑爬虫/AI 自修复
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@main

      - name: 下载线上已发布数据（不重新合并，数据与处理逻辑解耦）
        run: |
          set -euo pipefail
          mkdir -p site/data
          curl --fail --show-error --silent --location --retry 3 --max-time 120 \
            "https://phones.jiucai.eu.org/data/latest.json?t=$(date +%s)" \
            --output site/data/latest.json
          curl --fail --show-error --silent --location --retry 3 --max-time 120 \
            "https://phones.jiucai.eu.org/data/manifest.json?t=$(date +%s)" \
            --output site/data/manifest.json
          echo "最新线上数据行数: $(python3 -c "import json;print(len(json.load(open('site/data/latest.json'))))")"

      - name: 准备 Pages 静态站点
        run: |
          set -euo pipefail
          cp -R docs/phones/. site/
          touch site/.nojekyll
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          with open("site/data/manifest.json", "r", encoding="utf-8") as f:
              manifest = json.load(f)
          # 仅刷新 updatedAt（前端 CDN 缓存绕过依赖它）——数据本身未变
          manifest["updatedAt"] = datetime.now(timezone.utc).isoformat()
          with open("site/data/manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          print("manifest updatedAt 已刷新:", manifest["updatedAt"])
          PY

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上传 Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
