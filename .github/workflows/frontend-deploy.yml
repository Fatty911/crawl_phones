name: 前端展示独立部署
on:
  release:
    types: [published]

  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/phones/**'
      - '!docs/phones/data/**'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-frontend:
    if: ${{ github.event_name != 'release' || (github.event.release.tag_name != 'data-latest' && !startsWith(github.event.release.tag_name, 'cnb-data-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@main

      - name: 下载线上已发布数据（不重新合并，数据与处理逻辑解耦）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/download_verified_release.py --repo "$GITHUB_REPOSITORY" --dir release-files
          python scripts/prepare_cnb_pages.py --archive release-files/verified-site.zip --manifest release-files/manifest.json --site site
          echo "最新线上数据行数: $(python3 -c "import json;print(len(json.load(open('site/data/latest.json'))))")"

      - name: 准备 Pages 静态站点
        run: |
          set -euo pipefail
          touch site/.nojekyll
          python - <<'PY'
          from pathlib import Path
          import shutil
          for source in Path("docs/phones").rglob("*"):
              relative = source.relative_to("docs/phones")
              if relative.parts[0] == "data" or relative.as_posix() == "manifest.json":
                  continue
              if source.is_file():
                  target = Path("site") / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, target)
          PY
          cmp release-files/manifest.json site/data/manifest.json

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上传 Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
